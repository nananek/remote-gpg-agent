name: image

# ghcr.io/<owner>/<repo> へマルチアーキテクチャ（amd64 / arm64）で配る。
# 実行イメージは distroless static nonroot 固定（deploy/Dockerfile）。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  # publish は途中で打ち切らない（レジストリへの push を中断させない）
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: image name (ghcr は小文字のみ)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # push の前に、配備前提（distroless nonroot）を実際のイメージで確かめる。
      - name: verify distroless nonroot
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: rga-server:verify
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      - name: assert distroless nonroot
        run: |
          set -euo pipefail
          user=$(docker image inspect rga-server:verify --format '{{.Config.User}}')
          echo "Config.User=$user"
          case "$user" in
            nonroot:nonroot | 65532:65532) ;;
            *)
              echo "image must run as nonroot (65532), got '$user'" >&2
              exit 1
              ;;
          esac

          base=$(docker image inspect rga-server:verify \
            --format '{{index .Config.Labels "org.opencontainers.image.base.name"}}')
          echo "base=$base"
          case "$base" in
            gcr.io/distroless/*:nonroot) ;;
            *)
              echo "base image must be distroless nonroot, got '$base'" >&2
              exit 1
              ;;
          esac

          if docker run --rm --entrypoint /bin/sh rga-server:verify -c true 2>/dev/null; then
            echo "image unexpectedly contains /bin/sh" >&2
            exit 1
          fi

          docker run --rm --entrypoint /rga-server rga-server:verify vapid > /tmp/vapid.txt
          grep -q '^RGA_VAPID_PUBLIC=' /tmp/vapid.txt

      - name: build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      - name: summary
        run: |
          {
            echo "### pushed image"
            echo
            echo '```'
            echo "${{ steps.image.outputs.name }}"
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
